<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#171410">
  <title>黒板メニュー管理｜Pigna piccola</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <a href="../index.html" class="admin-brand" aria-label="Pigna piccola トップへ">
        <img src="../images/logo-clean.png" alt="Pigna piccola">
      </a>
      <span>黒板メニュー管理</span>
    </header>

    <section class="admin-card" id="loadingPanel">
      <p class="admin-muted">管理画面を準備しています…</p>
    </section>

    <section class="admin-card" id="setupPanel" hidden>
      <span class="admin-eyebrow">FIRST SETUP</span>
      <h1>暗証番号を設定</h1>
      <p class="admin-lead">初回のみ、管理画面で使う6桁の数字を決めてください。</p>
      <form id="setupForm" class="pin-form">
        <label for="setupPin">6桁の暗証番号</label>
        <input id="setupPin" name="pin" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{6}" maxlength="6" placeholder="● ● ● ● ● ●" required>
        <button type="submit">暗証番号を設定</button>
      </form>
      <p class="admin-message" id="setupMessage" aria-live="polite"></p>
    </section>

    <section class="admin-card" id="loginPanel" hidden>
      <span class="admin-eyebrow">OWNER LOGIN</span>
      <h1>管理画面</h1>
      <p class="admin-lead">6桁の暗証番号を入力してください。</p>
      <form id="loginForm" class="pin-form">
        <label for="loginPin">暗証番号</label>
        <input id="loginPin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" pattern="[0-9]{6}" maxlength="6" placeholder="● ● ● ● ● ●" required>
        <button type="submit">ログイン</button>
      </form>
      <p class="admin-message" id="loginMessage" aria-live="polite"></p>
    </section>

    <section class="admin-dashboard" id="dashboardPanel" hidden>
      <section class="admin-card admin-card--current">
        <div class="admin-card-head">
          <div><span class="admin-eyebrow">CURRENT</span><h1>現在の黒板</h1></div>
          <button class="text-button" id="logoutButton" type="button">ログアウト</button>
        </div>
        <p class="current-updated" id="currentUpdated">まだ更新されていません</p>
        <div class="current-photo" id="currentPhoto">
          <img id="currentImage" alt="現在掲載中の黒板メニュー" hidden>
          <p id="currentEmpty">まだ黒板写真は掲載されていません。</p>
        </div>
      </section>

      <section class="admin-card">
        <span class="admin-eyebrow">UPDATE</span>
        <h2>黒板写真を変更</h2>
        <p class="admin-lead">スマホで黒板を撮影するか、写真を選択してください。</p>

        <label class="photo-picker" for="blackboardFile">
          <input id="blackboardFile" type="file" accept="image/jpeg,image/png,image/webp,image/*" capture="environment">
          <span class="photo-picker__icon">＋</span>
          <strong>写真を撮る・選ぶ</strong>
          <small>スマホ写真対応・自動でWeb用に最適化</small>
        </label>

        <div class="upload-preview" id="uploadPreview" hidden>
          <img id="previewImage" alt="更新前プレビュー">
          <button type="button" id="clearPreview">選び直す</button>
        </div>

        <button class="publish-button" type="button" id="publishButton" disabled>ホームページに掲載する</button>
        <p class="admin-message" id="uploadMessage" aria-live="polite"></p>
      </section>

      <details class="admin-card admin-card--settings">
        <summary>暗証番号を変更</summary>
        <form id="changePinForm" class="pin-form pin-form--compact">
          <label for="newPin">新しい6桁の暗証番号</label>
          <input id="newPin" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{6}" maxlength="6" required>
          <button type="submit">変更する</button>
        </form>
        <p class="admin-message" id="changePinMessage" aria-live="polite"></p>
      </details>
    </section>

    <footer class="admin-footer"><a href="../index.html">ホームページを見る ↗</a></footer>
  </main>
  <script src="admin.js"></script>
</body>
</html>
